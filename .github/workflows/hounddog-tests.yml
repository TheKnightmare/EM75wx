name: Hound Dog tests

on:
  pull_request:
    paths:
      - "hounddog/**"
      - ".github/workflows/hounddog-tests.yml"
  push:
    branches: [main]
    paths:
      - "hounddog/**"
      - ".github/workflows/hounddog-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hounddog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
