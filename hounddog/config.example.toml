[operator]
callsign = "KQ4ODY"
network = "GHOSTNET"
region_label = "ETN/WNC/TN/KY/GA/NC"
max_message_chars = 500

[collection]
database = "data/hounddog.db"
max_age_days = 7
request_timeout_seconds = 20
max_response_bytes = 5000000
user_agent = "KQ4ODY-HoundDog/0.1 (set-a-real-contact@example.invalid)"

[[sources]]
id = "nws-tn"
kind = "nws_alerts"
name = "National Weather Service Tennessee"
url = "https://api.weather.gov/alerts/active?area=TN"
source_type = "official"
source_family = "nws"
enabled = true

